spring:
  application:
    name: bazaar-market

  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

logging:
  level:
    root: INFO
    com.conel.market: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/bazaar.log
    max-size: 10MB
    max-history: 30

app:
  security:
    jwt:
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
      private-key-path: ${JWT_PRIVATE_KEY_PATH}
      public-key-path: ${JWT_PUBLIC_KEY_PATH}

  email:
    verification-token-expiry: ${EMAIL_VERIFICATION_TOKEN_EXPIRY:24}
    from: ${MAIL_FROM}
    sender-name: ${MAIL_SENDER_NAME}
    verification-base-url: ${APP_VERIFICATION_BASE_URL}

  app:
    file-storage:
      upload-dir: ${FILE_UPLOAD_DIR:./uploads}
      max-file-size-mb: ${FILE_MAX_SIZE_MB:5}
      allowed-content-types: ${FILE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}

  rag:
    project-root: ${RAG_PROJECT_ROOT:${user.dir}}

  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    phone: ${ADMIN_PHONE}